# Dependabot security updates (PR automatico a partir de um alerta de vulnerabilidade)
# sao uma configuracao de repositorio (Settings > Code security), nao deste arquivo.
# Confirmado habilitado em 22/09/2026 (docs/SECURITY.md T8). Este arquivo so cobre
# version updates agendadas.
version: 2
updates:
  # O repo usa yarn.lock; o Dependabot cobre yarn v1 pelo ecossistema "npm".
  # Majors do Expo SDK / React Native sobem juntos (npx expo install --fix), entao ficam fora do agrupamento.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors incompativeis com Expo SDK 57 (causaram o incidente de 21/09 -
      # bump quebrou o build). Remover quando o SDK 58 suportar essas majors.
      - dependency-name: '@react-native-async-storage/async-storage'
        versions: ['>=3.0.0']
      - dependency-name: 'react-native-gesture-handler'
        versions: ['>=3.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
