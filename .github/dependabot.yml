# Dependabot security updates (PR automatico a partir de um alerta de vulnerabilidade)
# sao uma configuracao de repositorio (Settings > Code security), nao deste arquivo.
# Confirmado habilitado em 22/09/2026 (docs/SECURITY.md T8). Este arquivo so cobre
# version updates agendadas.
version: 2
updates:
  # O repo usa yarn.lock; o Dependabot cobre yarn v1 pelo ecossistema "npm".
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # O Expo SDK fixa estas versões (inclusive patch). Sobem juntas na atualização de SDK com
    # `npx expo install --fix`, nunca isoladas: bump solto quebrou o build em 21/09/2026 e o
    # Dependabot abriu majors do SDK 58 em 25/09 com o projeto no 57. Alertas de segurança
    # continuam valendo (são configuração do repositório, não deste arquivo).
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-async-storage/*'
      - dependency-name: 'react-test-renderer'
      - dependency-name: '@types/react'
      - dependency-name: 'jest-expo'
      - dependency-name: 'typescript'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
