name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: yarn

      - run: yarn install --frozen-lockfile

      # expo-env.d.ts e gerado pelo `expo start` e fica no .gitignore; sem ele o tsc
      # nao conhece os imports de .css. Recria o mesmo conteudo que o Expo gera.
      - name: Gerar tipos do Expo
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      # Falta para virar bloqueante: o yarn 1 filtra so a saida com --level; o exit code
      # continua contando todas as severidades (moderada = 4). Hoje resta 1 moderada sem
      # correcao segura (expo-router > query-string > decode-uri-component, ver
      # docs/SECURITY.md T8), entao o passo falharia. Tirar o continue-on-error quando ela
      # for resolvida, ou trocar por um teste do exit code que ignore o bit de moderada.
      - name: Audit de dependencias
        run: yarn audit --level high
        continue-on-error: true

      - name: Test
        run: yarn test --ci
