name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: yarn install --ignore-scripts

      # --ignore-scripts barra o postinstall; o patch-package roda explicito.
      - run: yarn patch-package

      # expo-env.d.ts e gerado pelo `expo start` e fica no .gitignore; sem ele o tsc
      # nao conhece os imports de .css. Recria o mesmo conteudo que o Expo gera.
      - name: Gerar tipos do Expo
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Formatação
        run: yarn format:check

      # Falta para virar bloqueante: o yarn 1 filtra so a saida com --level; o exit code
      # continua contando todas as severidades (moderada = 4). Revalidado em 22/09/2026,
      # resta a mesma 1 moderada sem correcao segura (expo-router > query-string >
      # decode-uri-component, ver docs/SECURITY.md T8 — expo-router@57.0.22, a ultima do
      # SDK 57, ainda fixa query-string@^7.1.3), entao o passo falharia. Tirar o
      # continue-on-error quando ela for resolvida, ou trocar por um teste do exit code
      # que ignore o bit de moderada.
      - name: Audit de dependencias
        run: yarn audit --level high
        continue-on-error: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Test (Edge Functions)
        run: |
          deno test --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/handler_test.ts
          deno test --allow-read=supabase/functions/urbs-vehicles/fixtures --config supabase/functions/urbs-vehicles/deno.json supabase/functions/urbs-vehicles/

      - name: Test
        run: yarn test --ci
