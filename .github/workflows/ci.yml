name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      # expo-env.d.ts e gerado pelo `expo start` e fica no .gitignore; sem ele o tsc
      # nao conhece os imports de .css. Recria o mesmo conteudo que o Expo gera.
      - name: Gerar tipos do Expo
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Typecheck
        run: yarn typecheck

      # Falta para virar bloqueante: 2 erros react-hooks/set-state-in-effect
      # (src/hooks/useUserLocation.ts, src/hooks/use-color-scheme.web.ts) e 10 warnings.
      - name: Lint
        run: yarn lint
        continue-on-error: true

      # Sem passo de testes ainda: jest-expo entra na task de testes unitarios (E8).
